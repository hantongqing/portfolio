<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品集 </title>
<meta name="description" content="AI Agent 产品设计 · 多智能体系统 · 智能体工程实践">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<meta property="og:type" content="website">
<meta property="og:title" content="作品集 ✨">
<meta property="og:description" content="AI Agent 产品设计 · 多智能体系统 · 智能体工程实践">
<meta property="og:url" content="https://hantongqing.github.io/portfolio/">
<style>
  :root {
    --glass: rgba(255,255,255,.10);
    --glass-strong: rgba(255,255,255,.16);
    --stroke: rgba(255,255,255,.22);
    --text: #f4faff;
    --text-soft: #c3dcff;
    --blue: #3b9dff;
    --indigo: #5f6dff;
    --cyan: #7ee8fa;
    --radius: 24px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    min-height: 100vh;
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    line-height: 1.8;
    overflow-x: hidden;
    background: linear-gradient(-45deg, #0f2b52, #1c4d8f, #2b7ec9, #1a5aa0, #0f2b52);
    background-size: 400% 400%;
    animation: sky 22s ease infinite;
  }
  body.night {
    background: linear-gradient(-45deg, #030a1c, #081638, #0d2050, #051027, #030a1c);
    background-size: 400% 400%;
    animation: sky 22s ease infinite;
    --text: #eef4ff;
    --text-soft: #b0c8ff;
  }
  @keyframes sky { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

  a { color: inherit; text-decoration: none; }
  .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 2; }

  /*  星星 */
  .stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .star {
    position: absolute; width: 3px; height: 3px; background: #fff; border-radius: 50%;
    box-shadow: 0 0 6px 1px #fff; animation: twinkle 3s infinite ease-in-out;
  }
  @keyframes twinkle { 0%,100%{opacity:.2; transform:scale(.6)} 50%{opacity:1; transform:scale(1.3)} }

  /*  蓝色光粒 */
  .sakura { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .petal {
    position: absolute; top: -8vh; width: 8px; height: 8px;
    background: radial-gradient(circle at 30% 30%, #d6ecff, #4da3ff);
    border-radius: 50%; opacity: .7;
    box-shadow: 0 0 8px 2px rgba(93,178,255,.55);
    animation: fall linear infinite;
  }
  @keyframes fall {
    0%   { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; }
    10%  { opacity: .9; }
    100% { transform: translateY(115vh) translateX(120px) rotate(540deg); opacity: .5; }
  }

  /*  光球 */
  .orb {
    position: fixed; top: 8%; right: 9%; width: 120px; height: 120px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff, #cfe8ff);
    box-shadow: 0 0 60px 20px rgba(150,200,255,.55); z-index: 0; animation: float 8s ease-in-out infinite;
  }
  body.night .orb { background: radial-gradient(circle at 35% 35%, #fff, #cfe0ff); box-shadow: 0 0 60px 20px rgba(180,200,255,.6); }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-18px)} }

  /* ===== 顶部导航 ===== */
  header {
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(14px); background: var(--glass);
    border-bottom: 1px solid var(--stroke);
  }
  .nav { display: flex; align-items: center; justify-content: space-between; height: 60px; }
  .logo { font-weight: 800; font-size: 18px; text-shadow: 0 0 12px rgba(59,157,255,.8); letter-spacing: .06em; }
  .toggle {
    background: var(--glass-strong); border: 1px solid var(--stroke); color: var(--text);
    width: 38px; height: 38px; border-radius: 10px; cursor: pointer; font-size: 16px;
    display: grid; place-items: center; transition: .25s;
  }
  .toggle:hover { transform: rotate(20deg) scale(1.1); box-shadow: 0 0 18px var(--indigo); }

  /* ===== 首屏 ===== */
  .hero { padding: 100px 0 70px; text-align: center; }
  .hero h1 {
    font-size: 56px; font-weight: 900; line-height: 1.1; margin-bottom: 16px;
    text-shadow: 0 4px 40px rgba(0,0,0,.3);
  }
  .grad {
    background: linear-gradient(90deg, #fff, var(--cyan), var(--blue), #fff);
    background-size: 200% auto; -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; animation: shine 4s linear infinite;
  }
  @keyframes shine { to { background-position: 200% center; } }
  .hero .subtitle { font-size: 20px; color: var(--text-soft); letter-spacing: .06em; }

  /* ===== 项目板块 ===== */
  section { padding: 40px 0 70px; }
  /* 仓库卡片网格 */
  .repo-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
  .repo-card {
    background: var(--glass); backdrop-filter: blur(14px);
    border: 1px solid var(--stroke); border-radius: 18px;
    padding: 24px 22px; transition: .3s;
    display: flex; flex-direction: column; gap: 10px;
  }
  .repo-card:hover { transform: translateY(-5px); box-shadow: 0 14px 40px rgba(59,157,255,.25); border-color: rgba(126,232,250,.4); }
  .repo-card-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .repo-name { font-size: 17px; font-weight: 800; color: #fff; word-break: break-word; }
  .repo-lang { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: rgba(59,157,255,.2); border: 1px solid rgba(255,255,255,.15); color: var(--text-soft); white-space: nowrap; }
  .repo-desc { font-size: 13.5px; color: var(--text-soft); line-height: 1.65; flex: 1; }
  .repo-bottom { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .repo-stars { font-size: 12px; color: var(--text-soft); opacity: .7; }
  .repo-date { font-size: 11px; color: var(--text-soft); opacity: .5; }
  .repo-link { font-size: 12px; font-weight: 700; color: var(--cyan); text-decoration: none; transition: .2s; }
  .repo-link:hover { color: #fff; text-shadow: 0 0 8px var(--cyan); }

  /* ===== 返回顶部 ===== */
  .to-top {
    position: fixed; right: 24px; bottom: 24px; z-index: 60;
    width: 46px; height: 46px; border-radius: 50%; cursor: pointer;
    border: 1px solid var(--stroke); color: var(--text); font-size: 20px;
    background: linear-gradient(90deg, var(--blue), var(--indigo));
    box-shadow: 0 6px 22px rgba(95,109,255,.6);
    display: grid; place-items: center;
    opacity: 0; visibility: hidden; transform: translateY(20px) scale(.8);
    transition: .3s;
  }
  .to-top.show { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }
  .to-top:hover { transform: translateY(-4px) scale(1.1); box-shadow: 0 10px 30px rgba(59,157,255,.8); }

  /* ===== 手机 ===== */
  @media (max-width: 1100px) {
    .repo-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  @media (max-width: 680px) {
    .hero { padding: 60px 0 40px; }
    .hero h1 { font-size: 38px; }
    .repo-grid { grid-template-columns: minmax(0, 1fr); }
    .to-top { right: 14px; bottom: 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    .sakura, .stars { display: none; }
  }
</style>
</head>
<body>

  <div class="orb"></div>
  <div class="stars" id="stars"></div>
  <div class="sakura" id="sakura"></div>

  <!-- 顶部导航 -->
  <header>
    <div class="container nav">
      <div class="logo">作品集</div>
      <button class="toggle" id="toggle" title="切换白天/夜晚"></button>
    </div>
  </header>

  <!-- 首屏 -->
  <section class="hero">
    <div class="container">
      <h1><span class="grad">我的项目</span> ✨</h1>
      <p class="subtitle">AI Agent 产品设计 · 多智能体系统 · 智能体工程实践</p>
    </div>
  </section>

  <!-- 公开仓库项目列表 -->
  <section id="github-projects" aria-label="公开仓库项目">
    <div class="container">
      <div class="repo-grid" id="repoGrid">
        <div style="grid-column:1/-1;text-align:center;padding:40px 0;color:var(--text-soft);opacity:.6;">⏳ 正在从 GitHub 加载项目…</div>
      </div>
    </div>
  </section>

<!-- 返回顶部 -->
<button class="to-top" id="toTop" title="回到顶部">↑</button>

<script>
  const stars = document.getElementById('stars');
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = (i * 37 % 100) + '%';
    s.style.top = (i * 53 % 100) + '%';
    s.style.animationDelay = (i % 10) * 0.3 + 's';
    s.style.opacity = 0.3 + (i % 5) * 0.14;
    stars.appendChild(s);
  }

  const sakura = document.getElementById('sakura');
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.left = (i * 5.5 % 100) + '%';
    p.style.animationDuration = (7 + (i % 6)) + 's';
    p.style.animationDelay = (i % 9) * 0.8 + 's';
    const scale = 0.6 + (i % 5) * 0.18;
    p.style.transform = 'scale(' + scale + ')';
    sakura.appendChild(p);
  }

  const toggle = document.getElementById('toggle');
  const saved = localStorage.getItem('sky');
  if (saved === 'night') { document.body.classList.add('night'); toggle.textContent = '☀️'; }
  else { toggle.textContent = '🌙'; }
  toggle.addEventListener('click', () => {
    document.body.classList.toggle('night');
    const isNight = document.body.classList.contains('night');
    toggle.textContent = isNight ? '☀️' : '🌙';
    localStorage.setItem('sky', isNight ? 'night' : 'day');
  });

  const toTop = document.getElementById('toTop');
  window.addEventListener('scroll', () => { toTop.classList.toggle('show', window.scrollY > window.innerHeight * 0.8); }, { passive: true });
  toTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

  // 加载公开仓库
  const GITHUB_USER = 'hantongqing';
  const starIcon = '⭐';

  async function loadGitHubRepos() {
    const grid = document.getElementById('repoGrid');
    try {
      const res = await fetch(`https://api.github.com/users/${GITHUB_USER}/repos?per_page=100&sort=created&direction=desc`);
      if (!res.ok) throw new Error('GitHub API error');
      const repos = await res.json();

      // 渲染仓库网格
      if (repos.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-soft);opacity:.6;">暂无公开仓库</div>';
        return;
      }
      grid.innerHTML = repos.map(r => {
        const desc = r.description || '暂无描述';
        const lang = r.language || '';
        const stars = r.stargazers_count || 0;
        const date = r.created_at ? r.created_at.split('T')[0] : '';
        return `
          <div class="repo-card">
            <div class="repo-card-top">
              <span class="repo-name">${r.name}</span>
              ${lang ? `<span class="repo-lang">${lang}</span>` : ''}
            </div>
            <div class="repo-desc">${desc}</div>
            <div class="repo-bottom">
              <span class="repo-stars">${starIcon} ${stars}</span>
              ${date ? `<span class="repo-date">📅 ${date}</span>` : ''}
              <a class="repo-link" href="${r.html_url}" target="_blank" rel="noopener">查看 →</a>
            </div>
          </div>
        `;
      }).join('');
    } catch (e) {
      grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-soft);opacity:.6;">⚠️ GitHub 加载失败，请稍后刷新</div>';
    }
  }
  loadGitHubRepos();
</script>
</body>
</html>
